name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 브랜치에 연속으로 푸시되면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # step 의 if: 조건에서는 secrets 컨텍스트를 직접 못 쓰므로 env 로 승격시킨다.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 변조된 gradle-wrapper.jar 를 통한 공급망 공격 방지 (Gradle 공식 권장).
      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # 1) 컴파일 검증 (main + test 소스). 여기서 실패하면 "컴파일 실패"로 명확히 끊긴다.
      - name: 컴파일 (main + test)
        run: ./gradlew --no-daemon --stacktrace classes testClasses

      # 2) 패키징 + 전체 테스트(*ServiceTest 포함). Testcontainers 가 pgvector 컨테이너를 자동 기동한다
      #    (ubuntu-latest 러너는 Docker 내장이라 별도 설정 불필요).
      #    GEMINI_API_KEY 가 없으면 domain/item/embedding/*Test 는 @EnabledIfEnvironmentVariable 로 자동 skip.
      - name: 빌드 + 전체 테스트
        run: ./gradlew --no-daemon --stacktrace build

      # 성공/실패와 무관하게 테스트 리포트를 아티팩트로 남긴다.
      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      # 3) 컴파일 / 빌드 / 테스트 중 하나라도 실패하면 Discord 채널로 알림.
      #    DISCORD_WEBHOOK secret 이 없으면 이 스텝은 조용히 스킵된다.
      - name: 실패 시 Discord 알림
        if: failure() && env.DISCORD_WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          status: failure
          title: "CI 실패 — ${{ github.workflow }}"
          description: |
            브랜치: `${{ github.ref_name }}`
            커밋: `${{ github.sha }}`
            작성자: ${{ github.actor }}
            [실행 로그 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
