spring.application.name=project

# H2
# DB file name: used-market
# H2 Console JDBC URL: jdbc:h2:~/used-market
# File-based H2 creates the database file automatically on first application start.
spring.datasource.url=jdbc:h2:tcp://localhost/~/used-market
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA
# update: keep existing data across restarts, only add missing schema elements.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.use_sql_comments=true

decorator.datasource.p6spy.enable-logging=true
decorator.datasource.p6spy.multiline=true
decorator.datasource.p6spy.logging=slf4j

# SQL init is disabled because JPA creates tables from @Entity classes now.
spring.sql.init.mode=never

file.dir=C:/jinmindev/fileupload/

# Session
server.servlet.session.timeout=7d

# Orders
orders.auto-cancel.days=2

# Spring Batch
# TCP H2가 아니라 embedded로 인식되지 않아 기본값(embedded)으로는 배치 스키마가 생성되지 않는다.
# always로 지정하되, 이미 스키마가 있으면 재부팅 시 건너뛴다(BatchDataSourceScriptDatabaseInitializer).
spring.batch.jdbc.initialize-schema=always
# 기본값 true면 부팅할 때마다 ordersAutoCancelJob이 즉시 1회 실행된다 - 원하는 트리거는
# OrdersAutoCancelScheduler의 매시 cron뿐이므로 부팅 시 자동실행은 끈다.
spring.batch.job.enabled=false