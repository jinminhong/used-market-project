spring.application.name=project

# PostgreSQL
# 로컬 개발 환경은 docker-compose.yml의 postgres 서비스(pgvector/pgvector:pg16)를 사용한다.
# docker compose up -d 로 기동 후 bootRun.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/used_market}
spring.datasource.username=${DB_USERNAME:used_market}
spring.datasource.password=${DB_PASSWORD:used_market}

# JPA
# update: keep existing data across restarts, only add missing schema elements.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.use_sql_comments=true

decorator.datasource.p6spy.enable-logging=true
decorator.datasource.p6spy.multiline=true
decorator.datasource.p6spy.logging=slf4j

# SQL init is disabled because JPA creates tables from @Entity classes now.
spring.sql.init.mode=never

file.dir=C:/jinmindev/fileupload/

# JWT
# jwt.secret은 로컬 전용 기본값이다. 운영 배포 시 반드시 JWT_SECRET 환경변수로 override할 것 (HS256은 256bit/32byte 이상 필요).
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-32bytes-minimum}
jwt.access-token-expiration-ms=1800000
jwt.refresh-token-expiration-ms=1209600000

# Refresh Token 쿠키 (로컬 http 개발 환경 기준값. 배포(HTTPS) 시 cookie.secure=true로 전환)
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# Orders
orders.auto-cancel.days=2

# Gemini 임베딩 (상품 시맨틱 검색용)
# GEMINI_API_KEY는 Google AI Studio(https://aistudio.google.com/apikey)에서 카드 등록 없이 무료 발급 가능.
gemini.api-key=${GEMINI_API_KEY:}
gemini.embedding.model=gemini-embedding-001
# items.embedding 컬럼과 HNSW 인덱스 크기를 가볍게 유지하기 위해 768차원으로 축소.
gemini.embedding.output-dimensionality=768

# Spring Batch
# TCP H2가 아니라 embedded로 인식되지 않아 기본값(embedded)으로는 배치 스키마가 생성되지 않는다.
# always로 지정하되, 이미 스키마가 있으면 재부팅 시 건너뛴다(BatchDataSourceScriptDatabaseInitializer).
spring.batch.jdbc.initialize-schema=always
# 기본값 true면 부팅할 때마다 ordersAutoCancelJob이 즉시 1회 실행된다 - 원하는 트리거는
# OrdersAutoCancelScheduler의 매시 cron뿐이므로 부팅 시 자동실행은 끈다.
spring.batch.job.enabled=false